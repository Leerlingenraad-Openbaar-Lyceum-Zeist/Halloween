<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween Filmavond — binnenkort meer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #130C11;
    --bg-alt: #1E1620;
    --ink: #F3E9DC;
    --muted: #B7A6B6;
    --pumpkin: #F2680A;
    --pumpkin-dim: #C4520A;
    --toxic: #8FC93A;
    --line: rgba(243,233,220,0.14);
    --font-display: 'Big Shoulders Display', sans-serif;
    --font-body: 'Space Grotesk', sans-serif;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  body::before{
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse 900px 600px at 20% -10%, rgba(242,104,10,0.18), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 100%, rgba(143,201,58,0.09), transparent 55%);
  }

  main{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    position: relative;
    z-index: 1;
  }

  .stage{
    max-width: 640px;
    text-align: center;
  }

  .badge{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border: 1px dashed var(--pumpkin-dim);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13.5px;
    color: var(--muted);
    background: rgba(242,104,10,0.06);
    margin-bottom: 32px;
  }
  .badge b{ color: var(--ink); font-weight: 600; }

  h1{
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(48px, 12vw, 108px);
    line-height: 0.88;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
    text-shadow: 0 0 40px rgba(242,104,10,0.22);
  }
  h1 .flicker{ color: var(--pumpkin); display: block; }
  @media (prefers-reduced-motion: no-preference){
    h1 .flicker{ animation: flicker 6s ease-in-out infinite; }
  }
  @keyframes flicker{
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: 0.4; }
    94% { opacity: 1; }
    95% { opacity: 0.55; }
    96% { opacity: 1; }
  }

  .soon{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(22px, 4vw, 30px);
    color: var(--toxic);
    margin: 0 0 24px;
    letter-spacing: 0.01em;
  }

  p.lead{
    font-size: clamp(15px, 2vw, 17.5px);
    color: var(--muted);
    max-width: 46ch;
    margin: 0 auto;
  }

  footer{
    padding: 28px 24px 36px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    position: relative;
    z-index: 1;
  }

  ::selection{ background: var(--pumpkin); color: #150B08; }
</style>
</head>
<body>

<main>
  <div class="stage">
    <div class="badge">🎃 <b>Oktober</b> <span>·</span> klas 1 t/m 6</div>
    <h1>Halloween<span class="flicker">filmavond</span></h1>
    <p class="soon">binnenkort meer</p>
    <p class="lead">De datum, de films en hoe je je aanmeldt volgen snel. Hou deze pagina in de gaten.</p>
  </div>
</main>

<footer>Georganiseerd door de leerlingenraad</footer>

</body>
</html>
